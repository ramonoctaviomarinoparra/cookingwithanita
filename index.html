<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking with Anita</title>
  <meta name="description" content="Relaxing cooking videos and homemade recipes." />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-wrap">
        <img src="logo.png" alt="Cooking with Anita logo" class="site-logo" />
      </div>

      <div class="lang-picker" aria-label="Language selector">
        <button class="lang-btn" data-lang="en" type="button">🇺🇸 EN</button>
        <button class="lang-btn" data-lang="es" type="button">🇪🇸 ES</button>
        <button class="lang-btn" data-lang="hi" type="button">🇮🇳 HI</button>
        <button class="lang-btn" data-lang="de" type="button">🇩🇪 DE</button>
      </div>
    </header>

    <main id="app">
      <section class="hero" id="hero"></section>

      <section class="content-grid">
        <div class="main-column">
          <section class="featured-video card" id="featured-video"></section>
          <section class="ad-slot card" id="ad-top">
            <div class="ad-label">Advertisement</div>
            <div class="ad-box">Place ad code here</div>
          </section>
          <section class="recipe-panel card" id="recipe-panel"></section>
          <section class="ad-slot card" id="ad-middle">
            <div class="ad-label">Advertisement</div>
            <div class="ad-box">Place ad code here</div>
          </section>
        </div>

        <aside class="side-column">
          <section class="card side-card" id="about-panel"></section>
          <section class="card side-card" id="next-panel"></section>
        </aside>
      </section>

      <section class="shelves" id="shelves"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
