
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking with Anita</title>
  <meta name="description" content="Coming soon: homemade recipes and cooking videos from Cooking with Anita." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f2;
      color: #2b2b2b;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      max-width: 760px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .logo {
      width: 100%;
      max-width: 380px;
      height: auto;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 0 auto 12px;
      max-width: 580px;
    }
    .tag {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #ffefe3;
      color: #c45200;
      font-weight: bold;
    }
    .footer {
      margin-top: 22px;
      font-size: 0.95rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="logo.png" alt="Cooking with Anita logo" class="logo" />
      <h1>Welcome to Cooking with Anita</h1>
      <p>
        Homemade flavor, simple recipes, and delicious kitchen inspiration.
      </p>
      <p>
        Coming soon: our recipes and videos.
      </p>
      <div class="tag">Website launching soon</div>
      <div class="footer">cocinandoconanita.com</div>
    </div>
  </div>
</body>
</html>
