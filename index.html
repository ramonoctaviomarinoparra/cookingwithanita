<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking with Anita</title>
  <meta
    name="description"
    content="Videos relajantes de cocina con receta en varios idiomas."
  />
  <link rel="stylesheet" href="styles.css" />
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3234336410896683"
    crossorigin="anonymous"
  ></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="logo.png" alt="Cooking with Anita" class="logo" />

      <div class="lang-picker" aria-label="Selector de idioma">
        <button class="lang-btn" data-lang="es" type="button">🇪🇸 ES</button>
        <button class="lang-btn" data-lang="en" type="button">🇺🇸 EN</button>
        <button class="lang-btn" data-lang="hi" type="button">🇮🇳 HI</button>
        <button class="lang-btn" data-lang="de" type="button">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="fr" type="button">🇫🇷 FR</button>
        <button class="lang-btn" data-lang="pt" type="button">🇧🇷 PT</button>
      </div>
    </header>

    <section class="hero" id="hero"></section>

    <section class="page-grid">
      <aside class="rail rail-left">
        <section class="card ad-box side-ad">
          <div class="ad-label" id="side-ad-left-label">Publicidad</div>
          <ins
            class="adsbygoogle ad-space ad-space-tall"
            style="display:block"
            data-ad-client="ca-pub-3234336410896683"
            data-ad-slot="4176908210"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
        </section>
      </aside>

      <main class="content-col">
        <section class="layout">
          <div class="main-col">
            <section class="card featured" id="featured"></section>
            <section class="card recipe" id="recipe"></section>
          </div>

          <aside class="side-col">
            <section class="card library">
              <div class="library-head">
                <h2 class="section-title" id="library-title">Biblioteca</h2>
                <p class="meta" id="library-subtitle">
                  Cada tarjeta carga el video y su receta.
                </p>
              </div>
              <div class="shelf-row" id="library"></div>
            </section>
          </aside>
        </section>

        <section class="bottom-ads">
          <section class="card ad-box">
            <div class="ad-label" id="bottom-ad-label">Publicidad</div>
            <ins
              class="adsbygoogle ad-space ad-space-wide"
              style="display:block"
              data-ad-client="ca-pub-3234336410896683"
              data-ad-slot="8197011876"
              data-ad-format="auto"
              data-full-width-responsive="true"
            ></ins>
          </section>
        </section>
      </main>

      <aside class="rail rail-right">
        <section class="card ad-box side-ad">
          <div class="ad-label" id="side-ad-right-label">Publicidad</div>
          <ins
            class="adsbygoogle ad-space ad-space-tall"
            style="display:block"
            data-ad-client="ca-pub-3234336410896683"
            data-ad-slot="5283073921"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
        </section>
      </aside>
    </section>
  </div>

  <script src="js/app.js"></script>
  <script>
    try {
      (adsbygoogle = window.adsbygoogle || []).push({});
      (adsbygoogle = window.adsbygoogle || []).push({});
      (adsbygoogle = window.adsbygoogle || []).push({});
    } catch (error) {
      console.warn("Ads could not be initialized:", error);
    }
  </script>
</body>
</html>
